name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      plan_only:
        description: "Review the production plan without deploying"
        type: boolean
        default: false

concurrency:
  group: deploy-prod

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      VITE_APP_VERSION: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun run state:test

      - run: bun run --cwd apps/research verify

      - run: bun run --cwd apps/gpu lint

      - run: bun run --cwd apps/gpu typecheck

      - run: bun run --cwd apps/gpu test

      - run: bun run --cwd packages/telemetry test

      - run: bun run --cwd packages/telemetry typecheck

      - run: bun run build:og

      - name: Plan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bun alchemy plan --stage prod --no-input

      - name: Deploy
        if: ${{ inputs.plan_only != true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: bun alchemy deploy --stage prod --yes
